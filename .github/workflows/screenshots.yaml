name: Screenshots

# Re-renders the README images from the real card bundle and commits them
# when they changed. Pushes made with GITHUB_TOKEN do not trigger workflows,
# so this cannot loop.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/screenshots.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Render screenshots
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run screenshots
      - name: Commit changed screenshots
        run: |
          if git diff --quiet -- docs/; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: update screenshots"
          git push
