name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # dist/ is not committed: HACS finds the bundle as a release asset, which the
  # Release workflow uploads after publishing. Validate again once it is there.
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
