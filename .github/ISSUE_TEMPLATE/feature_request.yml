name: Feature request
description: Suggest an option, a view or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you want to see or analyse, and why.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the card support it?
      description: Options, layout, an example from pyedautils or another tool.
